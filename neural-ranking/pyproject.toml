[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-ranking"
version = "0.1.0"
description = "Two-stage neural ranking system (BM25 retrieval + cross-encoder re-ranking) with TF-IDF and bi-encoder baselines"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch==2.6.0",
    "transformers==4.49.0",
    "sentence-transformers==3.4.1",
    "datasets==3.3.2",
    "rank-bm25==0.2.2",
    "scikit-learn==1.6.1",
    "pytrec_eval==0.5",
    "pandas==2.2.3",
    "pyyaml==6.0.2",
    "tqdm==4.67.1",
    "matplotlib==3.10.0",
    "gradio==5.16.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

