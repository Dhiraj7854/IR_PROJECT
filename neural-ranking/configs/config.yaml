# Two-Stage Neural Ranking System Configuration

dataset:
  name: "msmarco-passage"
  corpus_subset_size: 100000
  query_splits:
    train: 3500
    val: 750
    test: 750

models:
  biencoder_name: "sentence-transformers/all-MiniLM-L6-v2"
  crossencoder_name: "cross-encoder/nli-MiniLM2-L6-H768"
  max_seq_len: 256

training:
  batch_size: 64
  lr: 0.00002
  epochs: 2
  fp16: true
  warmup_ratio: 0.1
  early_stopping_patience: 1

retrieval:
  stage1_top_k: 100
  rerank_depth: 50
  rrf_k: 60
  rrf_weights: {}
  rocchio_alpha: 1.0
  rocchio_beta: 0.75
  rocchio_gamma: 0.15
